<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6f8fa"/>
  <rect x="1" y="1" width="1198" height="628" rx="8" fill="#ffffff"/>
  <!-- Left photo frame -->
  <rect x="80" y="80" width="460" height="470" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="330" font-family="system-ui,sans-serif" font-size="80" fill="#d0d7de" text-anchor="middle">📷</text>
  <text x="310" y="510" font-family="system-ui,sans-serif" font-size="22" fill="#0969da" text-anchor="middle" font-weight="600">2020</text>
  <!-- Right photo frame -->
  <rect x="660" y="80" width="460" height="470" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="890" y="330" font-family="system-ui,sans-serif" font-size="80" fill="#d0d7de" text-anchor="middle">📷</text>
  <text x="890" y="510" font-family="system-ui,sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="600">2024</text>
  <!-- Arrow between frames -->
  <line x1="555" y1="315" x2="645" y2="315" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
  <polygon points="643,308 656,315 643,322" fill="#0969da"/>
  <!-- Title -->
  <text x="600" y="590" font-family="system-ui,sans-serif" font-size="28" fill="#57606a" text-anchor="middle">ChronoSync — Temporal photo alignment</text>
</svg>
