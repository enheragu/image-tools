<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ChronoSync favicon">
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="#161b22"/>

  <!-- One clock device cut in half: analog face (left) + digital half (right) -->
  <path d="M25,17 H50 Q54,17 54,21 V43 Q54,47 50,47 H25 A15 15 0 0 1 25,17 Z"
        fill="#1a212b" stroke="#30363d" stroke-width="1.5"/>

  <!-- Digital minutes 24 (seven-segment, lit) -->
  <g stroke="#79c0ff" stroke-width="2" stroke-linecap="round">
    <!-- 2 = a b g e d -->
    <line x1="33" y1="25" x2="38" y2="25"/>
    <line x1="39" y1="27" x2="39" y2="31"/>
    <line x1="33" y1="32" x2="38" y2="32"/>
    <line x1="32" y1="33" x2="32" y2="37"/>
    <line x1="33" y1="39" x2="38" y2="39"/>
    <!-- 4 = f g b c -->
    <line x1="44" y1="27" x2="44" y2="31"/>
    <line x1="45" y1="32" x2="50" y2="32"/>
    <line x1="51" y1="27" x2="51" y2="31"/>
    <line x1="51" y1="33" x2="51" y2="37"/>
  </g>
  <!-- Colon: cut in half at the seam -->
  <g fill="#79c0ff">
    <rect x="25" y="29" width="3" height="3" rx="1"/>
    <rect x="25" y="34" width="3" height="3" rx="1"/>
  </g>

  <!-- Seam (the cut) -->
  <line x1="25" y1="17" x2="25" y2="47" stroke="#30363d" stroke-width="1"/>

  <!-- Analog half (left): ticks + hour hand -->
  <g stroke="#46566a" stroke-width="1.5" stroke-linecap="round">
    <line x1="14" y1="32" x2="12" y2="32"/>
    <line x1="15.5" y1="26.5" x2="13.7" y2="25.5"/>
    <line x1="19.5" y1="22.5" x2="18.5" y2="20.7"/>
    <line x1="15.5" y1="37.5" x2="13.7" y2="38.5"/>
    <line x1="19.5" y1="41.5" x2="18.5" y2="43.3"/>
  </g>
  <line x1="25" y1="32" x2="16.3" y2="27" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="25" cy="32" r="1.8" fill="#58a6ff"/>
</svg>
